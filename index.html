  excerpt:"郵便列車を襲い巨額を奪った15人組。逃亡犯の物語も有名。",
  body:`1963年、イギリスで「世紀の犯罪」と呼ばれる大胆な強盗事件が起きた。

8月のある未明、グラスゴーからロンドンへ向かう郵便列車を、15人組の強盗団が襲った。彼らは線路脇の信号機に細工をして列車を停め、積まれていた大量の旧紙幣——当時の260万ポンド（現在の数十億円規模）を奪って逃走した。

銃こそ使わなかったが、列車の運転士が殴られて重傷を負うなど、手荒い犯行だった。

周到な計画だったが、隠れ家に残された指紋などから足がつき、メンバーはほぼ全員が逮捕される。中でもロニー・ビッグズは、服役中に脱獄して海外へ逃亡。30年以上も逃げ続けた末に帰国し、世間を騒がせた。映画にもなった、犯罪史に残る大事件だ。`,
  src:"https://ja.wikipedia.org/wiki/大列車強盗_(1963年の事件)"},

 {cat:"事件・事故",truth:"fact",emoji:"🗼",caution:1,
  title:"エッフェル塔を売った詐欺師「ヴィクトール・ルースティヒ」",
  excerpt:"政府高官になりすまし、パリの象徴を“スクラップ”として売却。",
  body:`「エッフェル塔を売った男」——そう呼ばれる伝説の詐欺師がいる。ヴィクトール・ルースティヒだ。

1925年のパリ。当時、老朽化したエッフェル塔の維持費が問題視されていた。ルースティヒはそこに目をつけ、フランス政府の高官になりすます。そして6人の鉄スクラップ業者をひそかに集め、「政府は塔を解体する。その鉄くずを売却する。これは極秘だ」と持ちかけた。

信じ込んだ業者の一人から、彼は大金を騙し取って姿を消した。だまされた業者は、恥ずかしさから訴え出ることもできなかった。あろうことか、ルースティヒは後に同じ手口をもう一度試みている。

偽の紙幣製造機を売りつける詐欺なども働いた彼は、最終的にアメリカで逮捕された。人の欲と見栄につけ込んだ、史上もっとも大胆な詐欺師の一人だ。`,
  src:"https://ja.wikipedia.org/wiki/ヴィクトール・ルースティヒ"},

 {cat:"事件・事故",truth:"fact",emoji:"💸",caution:1,
  title:"自転車操業の出資金詐欺「ポンジ・スキーム」",
  excerpt:"“高配当”の正体は、後から来た人の金。詐欺の代名詞になった男。",
  body:`「ポンジ・スキーム」——出資金詐欺の代名詞となっているこの言葉は、ある実在の人物の名前に由来する。チャールズ・ポンジだ。

1920年ごろ、アメリカで活動したポンジは、「短期間で高い配当を出す」とうたって投資家から資金を集めた。だが、その配当の正体は、運用で得た利益ではなかった。後から入ってきた新しい出資者のお金を、先の出資者への“配当”として回していただけだったのだ。

この仕組みは、新たな出資者が増え続けないと成り立たない。やがて資金繰りが行き詰まって破綻し、多くの人が大金を失い、ポンジは逮捕された。

中身のない“高配当”で人を集め、自転車操業で回す——この詐欺の構造は、形を変えて今も世界中で繰り返されている。彼の名は、その警告として残り続けている。`,
  src:"https://ja.wikipedia.org/wiki/チャールズ・ポンジ"},

 {cat:"事件・事故",truth:"solved",emoji:"🦴",caution:1,
  title:"科学を40年だました捏造「ピルトダウン人」",
  excerpt:"“サルと人の中間”の化石。だが、それは巧妙な作り物だった。",
  body:`20世紀初め、進化の謎を解く大発見とされたものがあった。1912年にイギリスで見つかったとされる頭骨の化石、「ピルトダウン人」だ。

それは、人間のような頭蓋骨と、類人猿のような顎を併せ持っていた。「サルと人の中間（ミッシング・リンク）」を示す証拠だとして、学界でも長く受け入れられた。

しかし約40年後、最新の年代測定などによって、衝撃の事実が判明する。これは捏造だったのだ。中世の人間の頭蓋骨に、オランウータンの顎を組み合わせ、古く見えるように着色し、歯を削って加工した“作り物”だった。

誰が、何のために仕組んだのかは、はっきりしていない。科学を40年ものあいだだまし続けた、有名な捏造事件として語り継がれている。`,
  src:"https://ja.wikipedia.org/wiki/ピルトダウン人"},

 {cat:"事件・事故",truth:"fact",emoji:"⚖️",caution:2,
  title:"国を二分した冤罪「ドレフュス事件」",
  excerpt:"スパイの濡れ衣を着せられた軍人。偏見と組織の論理が暴走した。",
  body:`19世紀末のフランスを、根底から揺るがした冤罪事件がある。「ドレフュス事件」だ。

1894年、ユダヤ系の軍人ドレフュス大尉が、ドイツに軍事機密を売ったスパイだとして逮捕され、終身刑を言い渡された。だが、その証拠はずさんで、真犯人が別にいることを示す事実も次々と見つかった。

それでも軍は、組織の体面を守るために誤りを認めようとしなかった。背景には、当時の社会に根強かったユダヤ人への偏見もあった。

この不正に対し、作家エミール・ゾラが「私は弾劾する」と題した告発文を新聞に発表。世論を二分する大論争へと発展した。最終的にドレフュスの無実は認められ、名誉が回復された。

偏見と組織の論理が、いかに無実の人を陥れるか——正義のあり方を問い続ける事件だ。`,
  src:"https://ja.wikipedia.org/wiki/ドレフュス事件"},

 {cat:"事件・事故",truth:"fact",emoji:"🕵️",caution:2,
  title:"日本に潜んだ大物スパイ「ゾルゲ事件」",
  excerpt:"ドイツ人記者の正体はソ連のスパイ。中枢に食い込んだ諜報網。",
  body:`第二次世界大戦中の日本で、世界を驚かせた大規模なスパイ事件が発覚した。「ゾルゲ事件」だ。

中心人物は、ドイツの新聞記者として日本に滞在していたリヒャルト・ゾルゲ。彼の正体は、ソ連のために働く凄腕のスパイだった。ゾルゲは、ドイツ大使館にも食い込んで信頼を得る一方、日本人の協力者（元朝日新聞記者の尾崎秀実ら）とともに、機密情報を集めてソ連へ送り続けていた。

彼らがつかんだとされる情報の中には、戦争の行方を左右しかねない重大なものも含まれていたとされる。

1941年、この諜報網は摘発され、ゾルゲと尾崎は逮捕、後に処刑された。一国の中枢に深く潜り込んだ、20世紀を代表するスパイ事件である。`,
  src:"https://ja.wikipedia.org/wiki/ゾルゲ事件"},

 {cat:"事件・事故",truth:"fact",emoji:"🧙",caution:3,
  title:"宮廷を操った怪僧「ラスプーチンの暗殺」",
  excerpt:"皇帝一家に取り入った謎の男。その最期はあまりに異様だった。",
  body:`帝政ロシアの末期、宮廷で絶大な影響力を握った謎の人物がいた。「怪僧」とも呼ばれるグリゴリー・ラスプーチンだ。

彼は皇帝一家にとり入った。皇太子の病（血友病）を不思議な力で和らげたとされ、皇后の絶大な信頼を得たのだ。やがて政治にまで口を出すようになり、彼を危険視する貴族たちの恨みを買っていく。

1916年、ついに貴族らがラスプーチン暗殺を実行する。伝えられるところでは、毒を盛っても効かず、銃で撃たれてもなお抵抗し、最後は川に投げ込まれて絶命した——という、まるで怪物のような最期だった（ただし脚色も多いとされる）。

彼の死の翌年、ロシア革命で帝政は崩壊する。一人の謎めいた男が、帝国の終わりに深い影を落とした事件だ。`,
  src:"https://ja.wikipedia.org/wiki/グリゴリー・ラスプーチン"},

 {cat:"事件・事故",truth:"maybe",emoji:"🎈",caution:3,
  title:"数十秒で焼け落ちた巨大飛行船「ヒンデンブルク号爆発事故」",
  excerpt:"空の豪華旅客船が着陸直前に炎上。飛行船時代の終わりを告げた。",
  body:`1937年、当時の航空技術の象徴だった巨大飛行船「ヒンデンブルク号」が、悲劇的な最期を迎えた。

全長245メートルにもなるこの飛行船は、ドイツとアメリカを結ぶ豪華な空の旅を実現していた。だがその日、アメリカでの着陸態勢に入った直後、船体が突然炎に包まれ、わずか数十秒で焼け落ちてしまった。多くの乗客乗員が犠牲となり、その様子はラジオの実況や映像にも生々しく記録された。

原因については、機体に詰められていた燃えやすい水素ガスに、静電気などで引火したという説が有力だ。だが、発火のきっかけが具体的に何だったのかは、はっきりとは特定されていない。

この事故をきっかけに、飛行船の時代は急速に終わりを迎えた。技術の夢が一瞬で潰えた、象徴的な事故である。`,
  src:"https://ja.wikipedia.org/wiki/ヒンデンブルク号爆発事故"},

 {cat:"事件・事故",truth:"fact",emoji:"🟤",caution:3,
  title:"甘い波が街を襲った「ボストン糖蜜災害」",
  excerpt:"巨大タンクが破裂し、900万リットルの糖蜜が洪水となって町へ。",
  body:`1919年、アメリカ・ボストンで、世界でも類を見ない奇妙な災害が起きた。「糖蜜（とうみつ）の洪水」だ。

事件の主役は、巨大なタンクに貯蔵されていた大量の糖蜜（砂糖を作る過程でできる、どろりとした甘い液体）だった。ある日、このタンクが突然破裂。中から約900万リットルもの糖蜜が、巨大な波となって街路へあふれ出したのだ。

高さ数メートルにもなった粘り気のある黒い波は、すさまじい速さで街を襲い、建物を押しつぶし、人や馬をのみ込んだ。多くの死傷者が出る大惨事となった。

甘いはずの糖蜜が凶器になるという、信じがたい出来事。原因はタンクの強度不足などとされ、安全管理の重要性を示す教訓にもなった。実際に起きた、奇妙で痛ましい災害である。`,
  src:"https://ja.wikipedia.org/wiki/ボストン糖蜜災害"},

 {cat:"事件・事故",truth:"maybe",emoji:"🎺",caution:2,
  title:"童話の裏に実話？「ハーメルンの笛吹き男」",
  excerpt:"130人の子どもが消えたという古い記録。おとぎ話の元になった謎。",
  body:`グリム童話などで知られる「ハーメルンの笛吹き男」。ネズミ退治の報酬を町に踏み倒された男が、笛の音で町中の子どもたちをどこかへ連れ去ってしまう、という不気味な物語だ。

実はこの話、ただのおとぎ話ではない可能性がある。ドイツのハーメルンには、「1284年、130人の子どもが姿を消した」という趣旨の、古い記録が残されているのだ。

つまり、童話の背景には、本当に大勢の子どもが一度にいなくなる、という実際の出来事があったのではないか、と考えられている。

その正体については諸説ある。新天地への移住（植民）に若者が連れられていった、疫病や事故、あるいは何らかの遠征に加わった——などだ。だが、確かなことは分かっていない。おとぎ話の影に、本物の“集団失踪”が隠れているのかもしれない。`,
  src:"https://ja.wikipedia.org/wiki/ハーメルンの笛吹き男"},

 {cat:"事件・事故",truth:"maybe",emoji:"🔥",caution:3,
  title:"なぜ裏切ったのか「本能寺の変」",
  excerpt:"天下統一目前の信長を、家臣・明智光秀が討った。動機は今も謎。",
  body:`1582年、天下統一を目前にしていた武将・織田信長が、京都の本能寺で家臣の明智光秀に襲われ、命を落とした。日本史上、最も有名な事件のひとつ「本能寺の変」だ。

わずかな手勢しか連れていなかった信長は、光秀の大軍に囲まれ、寺に火を放って自害したと伝えられる。

この事件の最大の謎は、「なぜ光秀は、主君である信長を裏切ったのか」だ。動機をめぐっては、信長への私的な恨み（怨恨説）、自分が滅ぼされる前にという不安、天下を狙う野望、あるいは背後に黒幕がいたとする説など、実にさまざまな見方が、今も唱えられ続けている。

日本の歴史を大きく変えた一夜の事件。その動機の真相は、決定的な答えが出ないまま、人々の議論を呼び続けている。`,
  src:"https://ja.wikipedia.org/wiki/本能寺の変"},

 {cat:"事件・事故",truth:"fact",emoji:"⚔️",caution:3,
  title:"雪の朝の暗殺「桜田門外の変」",
  excerpt:"幕府の最高権力者・井伊直弼が、登城の途中で斬られた。",
  body:`1860年、江戸城の桜田門の近くで、幕府の最高権力者が白昼に暗殺されるという、衝撃的な事件が起きた。「桜田門外の変」だ。

殺されたのは、大老・井伊直弼。彼は「安政の大獄」で、開国に反対する勢力を厳しく弾圧していた。これに反発した水戸藩などの浪士たちが、雪の降る朝、登城する井伊の行列を襲撃したのだ。

時の最高権力者が、江戸城のすぐそばで斬り殺される——この事件は、幕府の権威を大きく揺るがした。

これをきっかけに、幕府の力はさらに衰え、世の中は明治維新へと向かう動乱の時代へ突き進んでいく。日本の歴史の大きな転換点となった、実在の暗殺事件である。`,
  src:"https://ja.wikipedia.org/wiki/桜田門外の変"},

 {cat:"事件・事故",truth:"fact",emoji:"✈️",caution:2,
  title:"総理経験者が逮捕「ロッキード事件」",
  excerpt:"航空機売り込みの巨額わいろ。日本政界を揺るがした大汚職。",
  body:`1976年、日本の政界を激震させた大規模な汚職事件が発覚した。「ロッキード事件」だ。

発端は、アメリカの航空機メーカー、ロッキード社が、自社の旅客機を売り込むために、各国の政府関係者に巨額のわいろを贈っていた、という疑惑だった。

日本でも捜査が進むと、元内閣総理大臣の田中角栄が逮捕されるという、前代未聞の事態に発展した。「総理大臣の経験者が逮捕される」という事実は、社会に大きな衝撃を与えた。

事件は長い裁判となり、政治と金の問題、そして政界の腐敗に、国民の厳しい目が向けられるきっかけとなった。戦後日本を代表する、巨大な政治スキャンダルである。`,
  src:"https://ja.wikipedia.org/wiki/ロッキード事件"},

 {cat:"事件・事故",truth:"fact",emoji:"🎌",caution:3,
  title:"雪の日のクーデター「二・二六事件」",
  excerpt:"青年将校が兵を率いて決起し、政府要人を襲撃した。",
  body:`1936年（昭和11年）2月26日、雪の降る東京で、日本の歴史を揺るがすクーデター未遂事件が起きた。「二・二六事件」だ。

国の現状に強い不満を抱いた陸軍の青年将校たちが、約1400名もの兵を率いて決起。「昭和維新」を掲げ、政府の要人たちを襲撃した。複数の要人が、この襲撃で命を落とした。

将校たちは一時、東京の中心部を占拠した。しかし、彼らの行動は天皇の強い怒りを買い、「反乱軍」と位置づけられる。やがて部隊は鎮圧され、首謀者たちは処刑された。

この事件の後、軍部の政治への影響力はかえって強まっていったとされる。日本が戦争へと傾斜していく時代の、大きな分岐点となった事件である。`,
  src:"https://ja.wikipedia.org/wiki/二・二六事件"},

 {cat:"事件・事故",truth:"fact",emoji:"🌉",caution:2,
  title:"風で踊って崩れた橋「タコマナローズ橋」",
  excerpt:"完成数か月のつり橋が、強くもない風でうねり、崩壊した。",
  body:`1940年、アメリカで完成したばかりの巨大なつり橋「タコマナローズ橋」が、わずか数か月後に、衝撃的な形で崩壊した。

その日、橋を襲ったのは、特別に強いわけでもない風だった。ところが橋は、風を受けてゆらゆらと波打ち始め、やがてその揺れがどんどん大きくなっていく。橋げたは、まるで紙のようにねじれ、うねり、ついに崩れ落ちてしまった。

原因は、風によって生じた振動が、橋そのものの揺れと共鳴するように増幅され続けたためと考えられている。

この崩壊の様子は映像にもはっきり記録され、世界中に衝撃を与えた。以来、橋の設計では風の影響が徹底的に研究されるようになる。失敗から多くを学んだ、有名な事故である。`,
  src:"https://ja.wikipedia.org/wiki/タコマナローズ橋"},

 {cat:"事件・事故",truth:"maybe",emoji:"🎼",caution:2,
  title:"毒殺された？「モーツァルトの死」",
  excerpt:"35歳で急死した天才。ライバル毒殺説の真相は。",
  body:`天才作曲家ヴォルフガング・アマデウス・モーツァルトは、1791年、35歳の若さでこの世を去った。あまりに早すぎる死は、ある“噂”を生むことになる。

それは、「ライバルの作曲家アントニオ・サリエリが、モーツァルトを毒殺したのではないか」という説だ。才能をねたんだサリエリが手を下した、という物語は、後に戯曲や映画『アマデウス』などで描かれ、広く知られるようになった。

しかし、これを裏づける証拠はない。今日では、サリエリ毒殺説は事実ではない、というのが大方の見方だ。

では、モーツァルトの本当の死因は何だったのか。リウマチ熱や感染症など、さまざまな病気が候補に挙げられているが、確定はしていない。天才の早すぎる死は、いまも完全には解き明かされていない。`,
  src:"https://ja.wikipedia.org/wiki/ヴォルフガング・アマデウス・モーツァルト"},

 {cat:"事件・事故",truth:"fact",emoji:"🎩",caution:3,
  title:"禁酒法時代の帝王「アル・カポネ」",
  excerpt:"密造酒で巨万の富を築いた大物ギャング。だが彼を倒したのは…。",
  body:`1920〜30年代のアメリカ・シカゴに君臨した、伝説的なギャングがいた。「アル・カポネ」だ。

当時のアメリカは、お酒の製造・販売を法律で禁じた「禁酒法」の時代。カポネは、この禁じられた酒を密造・密売することで巨万の富を築き、裏社会のボスにのし上がった。賭博などの違法な商売も仕切り、その勢力は警察や政治家にまで及んだとされる。

カポネは対立する組織との抗争も繰り広げ、数々の事件に関わったと噂された。しかし、巧妙に証拠を残さず、なかなか罪に問えなかった。

結局、彼を追い詰めたのは、意外にも「脱税」だった。莫大な収入を申告していなかったことで有罪となり、投獄されたのだ。法の網の外で暴れた大物が、税金で足をすくわれた——時代を象徴する事件である。`,
  src:"https://ja.wikipedia.org/wiki/アル・カポネ"},

 {cat:"事件・事故",truth:"maybe",emoji:"💃",caution:2,
  title:"人々が踊り続けた怪事件「踊りのペスト」",
  excerpt:"一人の女性から始まり、数百人が何週間も踊り狂ったという記録。",
  body:`1518年、現在のフランス・ストラスブールで、にわかには信じがたい出来事が起きた。「踊りのペスト」とも呼ばれる事件だ。

ある夏の日、一人の女性が、路上で突然、取りつかれたように踊りだした。彼女は何日も踊り続け、やがてその“踊り”が周囲に伝染していく。1か月ほどの間に、数十人から、一説には400人もの人々が、来る日も来る日も踊り続けたと、当時の医師や市の記録に残されている。

中には、踊りすぎて倒れる者もいたという。

なぜこんなことが起きたのか。原因はいまだに分かっていない。極度のストレスや不安からくる「集団ヒステリー（集団心因性疾患）」だったとする説や、麦に生えるカビ（麦角）による中毒説などがあるが、決め手はない。歴史に記録された、奇妙きわまる実在の事件だ。`,
  src:"https://ja.wikipedia.org/wiki/1518年の踊り病"},
 {cat:"事件・事故",truth:"fact",emoji:"💰",caution:2,
  title:"史上最大の出資金詐欺「バーナード・マドフ」",
  excerpt:"元ナスダック会長が仕組んだ、数兆円規模のポンジ・スキーム。",
  body:`2008年、世界を震撼させた史上最大級の詐欺が発覚した。元ナスダックの会長まで務めた大物投資家、バーナード・マドフによる巨額の出資金詐欺だ。

マドフは「安定して高い利回りを出す」とうたい、富裕層や慈善団体、銀行などから何兆円もの資金を集めていた。だが、その運用実態は無かった。後から入る出資者の金を、先の出資者への“配当”に回す——つまり巨大な「ポンジ・スキーム」だったのだ。

長年ばれなかったのは、彼の高い社会的信用と、巧妙に偽装された報告書のためだった。だが2008年の金融危機で解約が殺到し、資金が底をつき、すべてが崩壊した。

被害額は数兆円規模。マドフは禁錮150年の判決を受け、2021年に獄中で死亡した。「信用」がいかに巨大な嘘を覆い隠せるかを示した、桁外れの事件だ。`,
  src:"https://ja.wikipedia.org/wiki/バーナード・マドフ"},

 {cat:"事件・事故",truth:"fact",emoji:"📉",caution:2,
  title:"巨大企業の粉飾決算「エンロン事件」",
  excerpt:"全米屈指の優良企業が、不正会計の発覚で一瞬で崩壊した。",
  body:`2001年、アメリカの巨大エネルギー企業エンロンが、あっという間に経営破綻した。その裏にあったのは、史上に残る大規模な「粉飾決算」だった。

エンロンは一時、全米でも有数の優良企業ともてはやされていた。しかし実態は、複雑な会計操作で莫大な損失を隠し、利益を水増しして、健全な会社を装っていたのだ。

やがて不正が明るみに出ると株価は暴落し、会社は倒産。多くの従業員が職と年金を失った。不正を見逃していた大手会計事務所アーサー・アンダーセンも、巻き添えで解体に追い込まれた。

この事件をきっかけに、アメリカでは企業会計に対する規制が大幅に強化された。「優良企業」の看板の裏で進む組織ぐるみの不正——企業統治のあり方を根本から問い直させた事件である。`,
  src:"https://ja.wikipedia.org/wiki/エンロン"},

 {cat:"事件・事故",truth:"solved",emoji:"🖌️",caution:1,
  title:"ナチスを欺いた贋作画家「ファン・メーヘレン」",
  excerpt:"“幻のフェルメール”を量産し、専門家もナチス高官も騙した男。",
  body:`20世紀、ある画家が「フェルメールの幻の名画」を次々と“発見”し、美術界を熱狂させた。だが、それらはすべて、彼自身が描いた精巧な贋作だった。オランダの画家、ハン・ファン・メーヘレンだ。

彼はフェルメールの作風を巧みに模倣し、当時最高の鑑定家すら本物と信じ込ませた。その腕で、ナチス・ドイツの高官ゲーリングにも“フェルメール”を売りつけていた。

ところが第二次大戦後、それが彼の身を救う。ナチスに国宝級の名画を売った「売国奴」として逮捕された彼は、死刑を逃れるため「あれは私の贋作だ」と告白したのだ。

証明のため、彼は監視下でもう一枚“フェルメール”を描いてみせた。こうして彼は一転、「ナチスを欺いた男」として有名になった。本物と偽物、そして権威とは何かを問う、痛快な事件である。`,
  src:"https://ja.wikipedia.org/wiki/ハン・ファン・メーヘレン"},

 {cat:"事件・事故",truth:"fact",emoji:"🏦",caution:3,
  title:"“ストックホルム症候群”の語源「ノルマルム広場強盗事件」",
  excerpt:"人質が犯人に味方し始めた、心理学史に残る立てこもり事件。",
  body:`「ストックホルム症候群」——人質が、自分を捕らえた犯人に好意や共感を抱いてしまう、あの不思議な心理現象。その名前の由来となったのが、この事件だ。

1973年、スウェーデンの首都ストックホルムのノルマルム広場にある銀行に、武装した男が押し入り、行員数人を人質にとって立てこもった。男は、服役中の友人の釈放などを要求する。

数日間にわたる立てこもりの中で、奇妙なことが起きた。人質たちが、犯人に親しみを感じるようになり、解放を試みる警察のほうに反感を抱くようになったのだ。解放後も、人質は犯人をかばう証言をしたという。

この出来事を分析した研究者が名づけたのが「ストックホルム症候群」だ。極限状態に置かれた人間の心の不可解さを示した、心理学史にも残る事件である。`,
  src:"https://ja.wikipedia.org/wiki/ノルマルム広場強盗事件"},

 {cat:"事件・事故",truth:"fact",emoji:"🕵️‍♀️",caution:3,
  title:"伝説の女スパイ「マタ・ハリ」",
  excerpt:"社交界を魅了した踊り子。二重スパイの容疑で銃殺された。",
  body:`第一次世界大戦下のヨーロッパで、「妖艶な女スパイ」として伝説になった女性がいる。マタ・ハリだ。

オランダ出身の彼女は、エキゾチックな踊り子としてパリの社交界を魅了した。各国の軍人や有力者と交わるその立場が、やがて彼女をスパイ容疑へと巻き込んでいく。

1917年、フランス当局は彼女を「ドイツのために情報を集めた二重スパイ」として逮捕。裁判の末、銃殺刑に処された。

だが、彼女が本当に重要な情報を渡したのか、それともフランスが戦況の悪化の中で“スケープゴート”を必要としただけなのか——その実像には、今も議論がある。決定的な証拠は乏しかったとも言われる。華やかさと謎に包まれたまま散った、「女スパイ」の代名詞である。`,
  src:"https://ja.wikipedia.org/wiki/マタ・ハリ"},

 {cat:"事件・事故",truth:"fact",emoji:"☢️",caution:3,
  title:"原爆機密を渡したとされた夫婦「ローゼンバーグ事件」",
  excerpt:"冷戦下、スパイ罪で処刑された夫妻。量刑には今も論争が。",
  body:`冷戦初期のアメリカを揺るがした、スパイ事件がある。「ローゼンバーグ事件」だ。

1950年代、ジュリアスとエセルのローゼンバーグ夫妻が、アメリカの原子爆弾に関する機密を、ソ連に渡したスパイだとして逮捕された。米ソが核開発を競い合う、緊張の絶頂期だった。

裁判で夫妻は一貫して無実を主張したが、有罪となり、1953年、夫婦そろって死刑（電気椅子）に処された。アメリカで、スパイ罪により民間人が処刑された、まれな事件である。

夫妻が実際にどこまで関与していたのか、特に妻エセルの有罪は妥当だったのかをめぐっては、長く激しい論争が続いた。後年公開された資料で夫の関与は裏づけられたとされる一方、量刑の重さには今も疑問の声がある。冷戦の恐怖が生んだ、重い事件だ。`,
  src:"https://ja.wikipedia.org/wiki/ローゼンバーグ事件"},

 {cat:"事件・事故",truth:"fact",emoji:"🔫",caution:3,
  title:"世界大戦の引き金「サラエヴォ事件」",
  excerpt:"一発の銃弾が、数千万人が犠牲となる大戦争を呼び起こした。",
  body:`たった一発の銃弾が、世界を大戦争へと突き落とした——それが「サラエヴォ事件」だ。

1914年6月28日、オーストリア＝ハンガリー帝国の皇位継承者フランツ・フェルディナント大公夫妻が、訪問先のサラエヴォ（現ボスニア）で、セルビア人の青年に銃撃され、命を落とした。

この暗殺をきっかけに、オーストリアはセルビアに宣戦布告。すると、複雑に結ばれていた各国の同盟関係が将棋倒しのように作動し、ヨーロッパの大国が次々と参戦していった。こうして始まったのが、第一次世界大戦である。

一つの暗殺が、数千万人が犠牲となる未曽有の大戦へとつながった。歴史が、いかに小さなきっかけで激変しうるかを示す、最も有名な事件のひとつだ。`,
  src:"https://ja.wikipedia.org/wiki/サラエヴォ事件"},

 {cat:"事件・事故",truth:"fact",emoji:"🗡️",caution:3,
  title:"「ブルータス、お前もか」カエサル暗殺",
  excerpt:"古代ローマの英雄が、信頼した者たちの刃に倒れた。",
  body:`「ブルータス、お前もか」——古代ローマで最も有名なこの言葉は、ある暗殺事件から生まれた。

紀元前44年、共和政ローマで絶大な権力を握った英雄ガイウス・ユリウス・カエサル（シーザー）は、元老院の議場で、複数の議員たちに短剣で襲われ、命を落とした。彼が王のように独裁的な権力を握ることを恐れた、共和政擁護派による暗殺だった。

首謀者の中には、カエサルが目をかけ、信頼していたブルータスもいた。そのため「ブルータス、お前もか」という言葉が、裏切りの象徴として語り継がれた（ただし、本当にそう言ったかは定かではない）。

しかし暗殺者たちの思惑に反し、ローマは共和政へは戻らず、やがて帝政へと進んでいく。歴史の流れを変えた、古代世界の一大事件である。`,
  src:"https://ja.wikipedia.org/wiki/ガイウス・ユリウス・カエサル"},

 {cat:"事件・事故",truth:"fact",emoji:"🎭",caution:3,
  title:"劇場での凶弾「リンカーン大統領暗殺事件」",
  excerpt:"南北戦争を終えた大統領が、観劇中に撃たれた。",
  body:`1865年4月14日、アメリカは指導者を一瞬にして失った。南北戦争を終結に導いた第16代大統領エイブラハム・リンカーンが、暗殺されたのだ。

その夜、リンカーンはワシントンのフォード劇場で観劇していた。そこへ、南部の支持者で俳優のジョン・ウィルクス・ブースが背後から近づき、頭部を銃撃。大統領は翌朝、息を引き取った。アメリカ史上、初めて大統領が暗殺された事件である。

ブースは「南部の英雄」を気取り、混乱の中を逃走したが、数日後に追い詰められて死亡した。この暗殺は、実は政府高官を同時に狙った、より大きな陰謀の一部だった。

戦争が終わり、国の再建が始まろうとした矢先の悲劇。アメリカの歴史に深い傷を残した事件だ。`,
  src:"https://ja.wikipedia.org/wiki/リンカーン大統領暗殺事件"},

 {cat:"事件・事故",truth:"fact",emoji:"🧊",caution:3,
  title:"氷山に消えた豪華客船「タイタニック号沈没事故」",
  excerpt:"「絶対に沈まない船」の過信が、1500人以上の命を奪った。",
  body:`「絶対に沈まない船」と謳われた、当時世界最大の豪華客船タイタニック号。その処女航海は、悲劇に終わった。

1912年、イギリスからニューヨークへ向かう航海の途中、タイタニック号は北大西洋で巨大な氷山に衝突する。船体に裂け目が走り、海水が流れ込んだ。

さらに悲劇を大きくしたのが、救命ボートの不足だった。「沈まない」という過信から、ボートは乗客全員分には遠く足りなかった。混乱の中で多くの人々が逃げ場を失い、1500人以上が冷たい海に消えた。

この事故は世界に衝撃を与え、船舶の安全基準が大きく見直されるきっかけとなった。人間の技術への慢心が招いた、海難史上もっとも有名な事故である。`,
  src:"https://ja.wikipedia.org/wiki/タイタニック号沈没事故"},

 {cat:"事件・事故",truth:"fact",emoji:"🏭",caution:4,
  title:"史上最悪の原発事故「チェルノブイリ」",
  excerpt:"原子炉が暴走・爆発し、広大な土地が無人地帯になった。",
  body:`1986年、旧ソ連（現ウクライナ）のチェルノブイリ原子力発電所で、史上最悪とされる原発事故が起きた。

事故は、原子炉の安全性を確かめる試験の最中に発生した。操作の誤りと原子炉の構造的な欠陥が重なり、原子炉が暴走。爆発を起こして、大量の放射性物質を空に撒き散らした。

汚染は風に乗ってヨーロッパの広範囲に及び、周辺の住民は故郷を追われた。発電所の周辺は今も立ち入りが厳しく制限され、無人の街がそのまま残されている。

事故処理にあたった作業員や消防士の多くが、強い放射線にさらされた。当初、情報を隠そうとしたソ連の体質も、被害を広げたと批判された。原子力の恐ろしさと、情報公開の重要性を世界に刻みつけた事故である。`,
  src:"https://ja.wikipedia.org/wiki/チェルノブイリ原子力発電所事故"},

 {cat:"事件・事故",truth:"fact",emoji:"🚀",caution:3,
  title:"打ち上げ73秒後の悲劇「チャレンジャー号爆発事故」",
  excerpt:"生中継のさなか、スペースシャトルが空中で爆発した。",

const ART=ARTICLES.map((a,i)=>({...a,id:"a"+i,catName:a.cat,no:String(i+1).padStart(3,"0"),
  read:Math.max(2,Math.round(a.body.replace(/\s/g,"").length/150)),
  shock:rnd(62,99),rate:(3+Math.random()*2),rateN:rnd(40,900),vF:rnd(120,1200),vK:rnd(120,1200)}));
const CATEGORIES=[...new Set(ART.map(a=>a.cat))];

/* ===== GAS連携：デプロイ後の /exec URL をここに貼る（空ならダミー動作のまま） ===== */
const GAS_URL = "https://script.google.com/macros/s/AKfycbxZzXnDUARu3HgM8Rz89pR5wiw5aIKsj7gHbslp9jpB9K0E-iSk-RQL6q_SZ0Znog1LeA/exec";   // 例: "https://script.google.com/macros/s/XXXXXXXX/exec"
let STATS = {};       // GASから取得した集計 {id:{f,k,ss,sc}}
async function gas(params){
  const r = await fetch(GAS_URL + "?" + new URLSearchParams(params).toString());
  return r.json();
}
async function loadStats(){
  if(!GAS_URL) return;
  try{ const res = await gas({action:"stats"}); if(res&&res.ok){ STATS = res.stats||{}; renderHome(); renderRank(); } }
  catch(e){ console.warn("stats取得に失敗", e); }
}
function stat(id){ return STATS[id] || null; }
/* 衝撃度スコア：GASに評価データがあれば平均★×20（0〜100換算）、無ければダミー値 */
function shockScore(a){ const s=stat(a.id); return (s&&s.sc)? Math.round(s.ss/s.sc*20) : a.shock; }
/* ===== 閲覧数・シェア数・お気に入り数の記録（楽観的にローカルも更新） ===== */
function _ensureStat(id){ return STATS[id] || (STATS[id]={f:0,k:0,ss:0,sc:0,v:0,sh:0,fav:0}); }
const _viewed=new Set();
function trackView(id){ if(_viewed.has(id))return; _viewed.add(id); const s=_ensureStat(id); s.v=(s.v||0)+1; if(GAS_URL){ gas({action:"view",id}).catch(()=>{}); } }
function trackShare(id){ if(!id)return; const s=_ensureStat(id); s.sh=(s.sh||0)+1; if(GAS_URL){ gas({action:"share",id}).catch(()=>{}); } }
function trackFav(id,d){ const s=_ensureStat(id); s.fav=Math.max(0,(s.fav||0)+d); if(GAS_URL){ gas({action:"fav",id,d}).catch(()=>{}); } }

const DUMMY_CMT=[{n:"匿名さん",t:"これは諸説ありそう…でも夜に読むとゾッとする。"},{n:"通りすがり",t:"似た話を地元で聞いたことある。気になる。"}];

function artCard(a){return `<div class="art" onclick="openArt('${a.id}')"><div class="em">${a.emoji}</div>

function voteHTML(a){
  const my=getVote(a.id);
  if(!my){
    return `<div class="vote"><div class="vote-q">これ、事実？それともデマ？</div>
      <div class="vote-btns"><button class="fact" onclick="vote('${a.id}','fact')">事実だと思う</button><button class="fake" onclick="vote('${a.id}','fake')">デマだと思う</button></div></div>`;
  }

  let f,k;
  if(s){ f=s.f; k=s.k; }                                   // GAS：みんなの本当の集計
  else { f=a.vF+(my==="fact"?1:0); k=a.vK+(my==="fake"?1:0); } // ダミー
  const t=(f+k)||1, pf=Math.round(f/t*100), pk=100-pf;
  return `<div class="vote"><div class="vote-q">みんなの判定</div>
    <div class="vbar"><div class="f" style="width:${pf}%">事実 ${pf}%</div><div class="k" style="width:${pk}%">デマ ${pk}%</div></div>
    <div class="vmine">あなたの判定：<b>${my==="fact"?"事実":"デマ"}</b> ・ 投票 ${t.toLocaleString()}件</div></div>`;
}
async function vote(id,choice){
  lsSet("nk_vote_"+id,choice);
  if(GAS_URL){ try{ const res=await gas({action:"vote",id,choice}); if(res&&res.ok){ STATS[id]=Object.assign({ss:0,sc:0},STATS[id],{f:res.f,k:res.k}); } }catch(e){} }
  renderArt(get(id));
}

function rateHTML(a){
  const my=getRate(a.id);
  const sp=[1,2,3,4,5].map(n=>`<span class="${my&&n<=my?"on":""}" onclick="rate('${a.id}',${n})">★</span>`).join("");
  const s=stat(a.id);
  let avg,n;
  if(s&&s.sc){ avg=(s.ss/s.sc); n=s.sc; }                               // GAS：みんなの平均
  else { avg=(my?(a.rate*a.rateN+my)/(a.rateN+1):a.rate); n=a.rateN+(my?1:0); } // ダミー
  return `<div class="rate"><div class="lab">この事件にゾッとした？（衝撃度を評価）</div><div class="stars">${sp}</div><div class="avg">みんなの平均 ★${avg.toFixed(1)}（${n.toLocaleString()}件）</div></div>`;
}
async function rate(id,n){
  lsSet("nk_rate_"+id,n);
  if(GAS_URL){ try{ const res=await gas({action:"rate",id,v:n}); if(res&&res.ok){ STATS[id]=Object.assign({f:0,k:0},STATS[id],{ss:res.avg*res.count, sc:res.count}); } }catch(e){} }
  renderArt(get(id));
}

function shareHTML(a){
  const url=location.origin+location.pathname+`?a=${a.id}`;
  const text=`【ナンコレ】${a.title}\nこれ、事実だと思う…？👀 続きはこちら`;
  const tw=`https://twitter.com/intent/tweet?text=${encodeURIComponent(text)}&url=${encodeURIComponent(url)}`;
  const ln=`https://line.me/R/msg/text/?${encodeURIComponent(text+" "+url)}`;
  return `<div class="share-h">この事件、誰かに教える？</div><div class="share">
     <a class="tw" href="${tw}" target="_blank" rel="noopener" onclick="trackShare('${a.id}')">𝕏 でシェア</a>
     <a class="ln" href="${ln}" target="_blank" rel="noopener" onclick="trackShare('${a.id}')">LINE</a>
     <button class="cp" data-url="${url}" data-id="${a.id}" onclick="copyLink(this)">リンクをコピー</button></div>`;
}
function copyLink(btn){const u=btn.getAttribute("data-url");const id=btn.getAttribute("data-id");try{navigator.clipboard.writeText(u);btn.textContent="コピーしました ✓";trackShare(id);}catch(e){btn.textContent="長押しでコピー";}}

function esc(s){return String(s).replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));}
let memName="";
function getName(){try{return localStorage.getItem("nk_name")||"";}catch(e){return memName;}}
function setName(v){try{localStorage.setItem("nk_name",v);}catch(e){memName=v;}}
function cmtListHTML(id){
  const all=DUMMY_CMT.concat(getCmts(id));
  return all.map(c=>`<div class="cmt"><div class="who">${esc(c.n)}</div><div class="txt">${esc(c.t)}</div></div>`).join("");
}
function renderCmts(id){$("#cmtList").innerHTML=cmtListHTML(id);$("#cmtCount").textContent=DUMMY_CMT.length+getCmts(id).length;}
function addCmt(id){
  const ta=$("#cmtInput");const v=(ta.value||"").trim();if(!v)return;
  const nm=($("#cmtName").value||"").trim()||"名無しさん";
  setName(($("#cmtName").value||"").trim());
  const a=getCmts(id);a.push({n:nm,t:v});lsSet("nk_cmt_"+id,a);ta.value="";renderCmts(id);
}

function renderArt(a){
  const tr=TRUTH[a.truth];
  $("#ov").classList.add("on");
  const favBtn=$("#favBtn");
  const setFav=s=>{favBtn.classList.toggle("on",s);favBtn.textContent=s?"♥ お気に入り済み":"♡ お気に入り";};
  setFav(isFav(a.id));favBtn.onclick=()=>{const now=toggleFav(a.id);setFav(now);trackFav(a.id,now?1:-1);};
  const rel=ART.filter(x=>x.cat===a.cat&&x.id!==a.id).slice(0,5);
  $("#ovBody").innerHTML=`<div class="a-em">${a.emoji}</div>${tagsHTML(a)}
    <div class="a-ti">${a.title}</div>
    <div class="a-meta">📖 約${a.read}分 ・ 🔥衝撃度 ${shockScore(a)} ・ 真偽：${tr.t} ・ 閲覧注意 ${stars(a.caution)}</div>
    <div class="a-body">${bodyHTML(a)}</div>
    ${voteHTML(a)}
    ${rateHTML(a)}
    ${shareHTML(a)}
    <div class="src">出典：<a href="${a.src}" target="_blank" rel="noopener" style="color:var(--amber);word-break:break-all">${a.src}</a></div>
    <div class="rel-h">関連する事件簿</div><div class="list">${rel.map(artCard).join("")}</div>
    ${zucksRect()}`;
  $("#ovBody").scrollTop=0;
}
let _artOpens=0;
const INTERSTITIAL_EVERY=1; // 1=毎回表示 / 2=2記事に1回 / 3=3記事に1回 …
function maybeShowInterstitial(){
  _artOpens++;
  if(INTERSTITIAL_EVERY>0 && (_artOpens-1)%INTERSTITIAL_EVERY===0){ $("#adInt").classList.add("on"); }
}
function closeInterstitial(){ $("#adInt").classList.remove("on"); }
function openArt(id){const a=get(id);if(!a)return;if(HISTORY_OK){try{history.pushState({id},"",`?a=${id}`);}catch(e){HISTORY_OK=false;}}renderArt(a);trackView(id);maybeShowInterstitial();}
function goBack(){HISTORY_OK?history.back():$("#ov").classList.remove("on");}
if(HISTORY_OK){window.addEventListener("popstate",e=>{const id=(e.state&&e.state.id)||new URLSearchParams(location.search).get("a");const a=id&&get(id);a?renderArt(a):$("#ov").classList.remove("on");});}
function initRoute(){const id=new URLSearchParams(location.search).get("a");const a=id&&get(id);if(a){if(HISTORY_OK){try{history.replaceState({id},"",`?a=${id}`);}catch(e){}}renderArt(a);}}

renderHome();renderCat();renderRank();renderSearch();renderSave();initRoute();loadStats();
</script>
</body>
</html>
